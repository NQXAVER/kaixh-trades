# Refreshes data/desk/feed.json from free public RSS feeds.
# Does not edit today.json, grok.json, calendar, earnings, or any other tab.
# A push from this workflow does not start another run (GitHub ignores
# GITHUB_TOKEN pushes for scheduled workflows).

name: Desk news

on:
  workflow_dispatch:
  schedule:
    # Weekdays, every 30 minutes. 09:00–23:59 UTC is about 5:00 AM–7:59 PM ET
    # during daylight time and 4:00 AM–6:59 PM ET during standard time,
    # covering premarket, the cash session, and the early evening.
    - cron: '*/30 9-23 * * 1-5'
    # Weekday overnight, every 2 hours. Globex is quieter then.
    - cron: '20 0,2,4,6,8 * * 1-5'
    # Weekends, every 3 hours.
    - cron: '20 */3 * * 0,6'
    # Sunday evening, around the CME equity reopen (6:00 PM ET).
    # 22:20 UTC is 6:20 PM during daylight time; 23:20 UTC is 6:20 PM in winter.
    - cron: '20 22,23 * * 0'

permissions:
  contents: write

concurrency:
  group: desk-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check keyword tags
        run: python3 scripts/refresh_desk_news.py --self-test

      - name: Pull public feeds
        run: python3 scripts/refresh_desk_news.py

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/desk/feed.json
          if git diff --cached --quiet; then
            echo "No headline changes."
          else
            git commit -m "Refresh desk news feed"
            git push
          fi
